<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Faculty Coordinator Login | E-Cell Bareilly College</title>

    <link rel="stylesheet" href="css/faculty.css">
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <div class="login-logo">
                E-CELL
            </div>

            <h1>Faculty Coordinator</h1>

            <p class="login-subtitle">
                E-Cell Bareilly College
            </p>

            <div class="faculty-badge">
                Faculty Coordinator
            </div>

            <form id="facultyLoginForm">

                <div class="form-group">
                    <label for="email">Official Email</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter official email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter password"
                        required
                    >
                </div>

                <button type="submit" id="loginBtn">
                    Login to Dashboard
                </button>

                <p id="loginMessage"></p>

            </form>

            <div class="login-footer">
                <p>Authorized Faculty Access Only</p>
                <span>E-CELL • BAREILLY COLLEGE</span>
            </div>

        </div>

    </div>

    <script src="js/faculty-login.js"></script>

</body>

</html>
